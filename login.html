<body class="bg-azulescuro bodyimage">

    <div class="blurimgbody"></div>

    <!-- MENU -->
    <nav class="navbar bg-transparent">
        <div class="container-fluid">

            <button class="btn btn-vermelhovl p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu">
                ☰ Menu
            </button>

        </div>
    </nav>

    <!-- OFFCANVAS -->
    <div class="offcanvas offcanvas-start" id="menu">

        <div class="offcanvas-header bg-azulescuro">

            <h5 class="offcanvas-title text-light">
                Menu
            </h5>

            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>

        </div>

        <div class="offcanvas-body bg-azulescuro d-flex flex-column gap-2">

            <a href="cadastro.html" class="btn opcaomenu text-light border-light">

    <!-- LOGIN -->
    <section class="container py-5">

        <div class="row justify-content-center align-items-center" style="height: 70vh;">

            <div class="col-12 col-md-6">

                <form action="index.html" class="card shadow p-4 corform border border-light text-light rounded-4">

                    <h2 class="text-center mb-4">
                        Login
                    </h2>

                    <!-- EMAIL -->
                    <label class="form-label">
                        Email
                    </label>

                    <input class="form-control mb-3 rounded-3" type="email" placeholder="Informe seu email..." required>

                    <!-- SENHA -->
                    <label class="form-label">
                        Senha
                    </label>

                    <input class="form-control mb-2 rounded-3" type="password" placeholder="Informe sua senha..."
                        required>

                    <h2 class="text-left pt-0 mb-4" style="font-size: 15px;">
                        Não tem uma conta?
                        <a class="texto-vermelho" href="cadastro.html">Cadastre-se</a>
                    </h2>

                    <!-- BOTÃO -->
                    <button class="btn btn-vermelhovl rounded-3 w-100">
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </section>
